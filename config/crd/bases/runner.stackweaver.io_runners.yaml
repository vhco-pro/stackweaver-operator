---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: runners.runner.stackweaver.io
spec:
  group: runner.stackweaver.io
  names:
    kind: Runner
    listKind: RunnerList
    plural: runners
    singular: runner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef
      name: Pool
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runnerId
      name: Runner ID
      priority: 1
      type: string
    - jsonPath: .status.currentJobs
      name: Jobs
      type: integer
    - jsonPath: .status.podName
      name: Pod
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Runner is the Schema for the runners API.
          It represents a single Stackweaver runner pod managed by a RunnerPool.
          Runner resources are created and deleted by the RunnerPool controller —
          users should not create them directly.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Runner
            properties:
              poolRef:
                description: poolRef is the name of the RunnerPool that owns this
                  Runner.
                minLength: 1
                type: string
            required:
            - poolRef
            type: object
          status:
            description: status defines the observed state of Runner
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Runner.
                  Standard condition types:
                    - "PodReady": the underlying pod is running and ready
                    - "Registered": the runner has registered with the Stackweaver API
                    - "Healthy": heartbeats are being received within expected intervals
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentJobs:
                description: currentJobs is the number of jobs the runner is currently
                  executing.
                format: int32
                type: integer
              lastHeartbeat:
                description: |-
                  lastHeartbeat records the last time a heartbeat was received from
                  the runner agent.
                format: date-time
                type: string
              lastJobFinished:
                description: lastJobFinished records the time when the last job completed
                  on this runner.
                format: date-time
                type: string
              message:
                description: |-
                  message provides a human-readable message with details about the
                  runner's current state (e.g. error details).
                type: string
              phase:
                description: phase is the current lifecycle phase of this Runner.
                enum:
                - Pending
                - Registering
                - Idle
                - Busy
                - Draining
                - Terminated
                - Error
                type: string
              podName:
                description: podName is the name of the underlying Kubernetes pod.
                type: string
              runnerId:
                description: |-
                  runnerId is the UUID assigned by the Stackweaver API after successful
                  runner registration.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
