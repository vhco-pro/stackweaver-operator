# This rule is not used by the project stackweaver-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to runner.stackweaver.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: stackweaver-operator
    app.kubernetes.io/managed-by: kustomize
  name: runner-viewer-role
rules:
- apiGroups:
  - runner.stackweaver.io
  resources:
  - runners
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - runner.stackweaver.io
  resources:
  - runners/status
  verbs:
  - get
